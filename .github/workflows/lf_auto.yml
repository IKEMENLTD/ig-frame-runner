name: lf_auto
run-name: lf_auto ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 編集係の仕事の番号（でたらめな英数字）。指示は受付がドライブの _指示 に置き、作業箱が番号で取りに行く
        required: true
permissions:
  contents: read
concurrency:
  group: lf-auto-${{ inputs.job_id }}
# 自動で編集するフォルダの長尺の編集係（2026-11-12）。正本は IKEMENLTD/auto-video-edit の deploy/runner/lf_auto.yml（ここへ写す）。
# ユーザー「全自動だけど、API よりかは MCP 優先」＝Claude Code を MCP の道具だけで動かし（チャットのアプリと同じ道具・同じ決まり）、
# 考える代金はサブスクの札（CLAUDE_CODE_OAUTH_TOKEN）を優先する。札が無い時だけ API の鍵。
# 編集係は動画を開かない（素材は受付と作業箱 longform.yml が持つ）。道具は MCP の ave の5つと sleep だけ。
# ログには段の名前と結果だけ（札・書き起こし・編集表は出さない＝公開の repo の実行の画面に残る）。
jobs:
  lf_auto:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      JOB_ID: ${{ inputs.job_id }}
      PYTHONIOENCODING: utf-8
      CLAUDE_CODE_VERSION: 2.1.312
    steps:
      - name: 番号を確かめる
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f]{12}$ ]] || { echo "仕事の番号の形が違う"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4（2026-10-29 時点の版に固定）
        with:
          repository: IKEMENLTD/auto-video-edit
          ssh-key: ${{ secrets.AVE_DEPLOY_KEY }}
          persist-credentials: false
          path: ave
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5（2026-10-29 時点の版に固定）
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ave/tools/longform_pipeline/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4（2026-10-29 時点の版に固定）
        with:
          node-version: "22"
      - name: 道具を入れる
        run: |
          pip install -q -r ave/tools/longform_pipeline/requirements.txt
          npm install -g --silent "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: 指示を受け取る
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          SPEC_KEY: ${{ secrets.SPEC_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/auto"
          python ave/tools/longform_pipeline/lf_auto.py prep "$JOB_ID" "$RUNNER_TEMP/auto"
      - name: 編集係（MCP の道具だけ・ログには結果だけ）
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOW_API: ${{ vars.LF_AUTO_ALLOW_API }}
          DISABLE_AUTOUPDATER: "1"
          DISABLE_TELEMETRY: "1"
        run: |
          # 考える代金はサブスクの札を優先。API の鍵で動かすのは、管理者が repo の変数 LF_AUTO_ALLOW_API=1 で許した時だけ
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; echo "考える代金：サブスクの札"
          elif [ "$ALLOW_API" = "1" ] && [ -n "$ANTHROPIC_API_KEY" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; echo "考える代金：API の鍵（許しあり）"
          else echo "サブスクの札が未設定（API で動かす許しも無い）＝動かさない"; touch "$RUNNER_TEMP/auto/no_token"; rm -f "$RUNNER_TEMP/auto/mcp.json"; exit 0; fi
          install -d -m 700 "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
          set +e
          claude -p "$(cat "$RUNNER_TEMP/auto/prompt.md")" \
            --mcp-config "$RUNNER_TEMP/auto/mcp.json" --strict-mcp-config \
            --allowedTools "mcp__ave__longform_material" "mcp__ave__longform_frames" "mcp__ave__longform_submit" \
                           "mcp__ave__longform_check" "mcp__ave__job_status" "Bash(sleep:*)" \
            --output-format json > "$RUNNER_TEMP/auto/out.json" 2> "$RUNNER_TEMP/auto/err.txt"
          rc=$?
          set -e
          rm -f "$RUNNER_TEMP/auto/mcp.json"
          echo "編集係の終わりの番号：$rc"
      - name: 結果を記録する
        if: always()
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
        run: |
          rm -f "$RUNNER_TEMP/auto/mcp.json"
          python ave/tools/longform_pipeline/lf_auto.py done "$JOB_ID" "$RUNNER_TEMP/auto"
