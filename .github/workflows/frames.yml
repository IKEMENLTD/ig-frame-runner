name: frames
on:
  workflow_dispatch:
    inputs:
      items:
        description: '[{"id": "...", "url": "..."}] の JSON（URL は実行ごとに渡し、repo には残さない）'
        required: true
      tag:
        description: 結果の名前
        required: true
        default: run
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 道具を入れる
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow numpy yt-dlp
      - name: コマ一覧を作る
        env:
          ITEMS: ${{ inputs.items }}
        run: |
          printf '%s' "$ITEMS" > items.json
          python runner.py items.json out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tag }}
          path: out/
          retention-days: 1
