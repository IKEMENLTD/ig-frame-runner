name: edit
run-name: edit ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 仕事の番号（でたらめな英数字・中身の手がかりにならない物）
        required: true
      job:
        description: （古い渡し方・空でよい）指示は受付がドライブの _指示 に置き、作業箱が番号で取りに行く
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: edit-${{ inputs.job_id }}
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # 道具は非公開の repo から読み取り専用の鍵で取る（公開 repo には置かない）
      - uses: actions/checkout@v4
        with:
          repository: IKEMENLTD/auto-video-edit
          ssh-key: ${{ secrets.AVE_DEPLOY_KEY }}
          path: ave
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ave/tools/pipeline/requirements.txt
      - name: 道具を入れる
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          # torch は PyTorch の置き場「だけ」から先に入れ、残りは PyPI から（--extra-index-url で混ぜると、同じ名前の部品を取り違え得る）
          pip install -q --index-url https://download.pytorch.org/whl/cpu "$(grep -E '^torch==' ave/tools/pipeline/requirements.txt)"
          pip install -q -r ave/tools/pipeline/requirements.txt
      # 使い回しは「読む」と「保存する」を分ける。actions/cache は仕事が成功した時しか保存しないので、
      # 1回失敗すると次も外から落とし直し、配るサイトにつながらずに落ちた（2026-10-27）
      - name: 文字起こしの模型（使い回す）
        id: whisper
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/whisper
          key: whisper-turbo-small-v1
      - name: 効果音と BGM（使い回す・repo には入れない）
        id: sounds
        uses: actions/cache/restore@v4
        with:
          path: |
            ave/assets/sfx/lab
            ave/assets/bgm
          key: sounds-${{ hashFiles('ave/assets/sounds.json') }}
      - name: 効果音と BGM を揃える（落とせない音があっても止めない）
        run: python ave/tools/render/fetch_sounds.py > /dev/null
      - name: 効果音と BGM を保存する
        if: steps.sounds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ave/assets/sfx/lab
            ave/assets/bgm
          key: sounds-${{ hashFiles('ave/assets/sounds.json') }}
      # 指示はドライブから番号で受け取る（公開の実行の画面に、暗号化した指示も残さない・2026-10-28）。読んだら消す
      - name: 仕事の指示を受け取る
        env:
          JOB: ${{ inputs.job }}
          JOB_ID: ${{ inputs.job_id }}
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
        run: |
          if [ -n "$JOB" ]; then
            printf '%s' "$JOB" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BUNDLE_KEY -out job.json
          else
            python ave/tools/pipeline/fetch_spec.py "$JOB_ID" job.json
          fi
      - name: 編集する（ログには段の名前だけ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-sonnet-5-5' }}
          PYTHONIOENCODING: utf-8
        run: python ave/tools/pipeline/job.py job.json work
      - name: 文字起こしの模型を保存する
        if: always() && steps.whisper.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/whisper
          key: whisper-turbo-small-v1
      - name: 後片付け
        if: always()
        run: rm -rf work job.json
