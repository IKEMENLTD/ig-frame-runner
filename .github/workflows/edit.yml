name: edit
run-name: edit ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 仕事の番号（でたらめな英数字・中身の手がかりにならない物）
        required: true
      job:
        description: 仕事の指示（JSON）を BUNDLE_KEY で暗号化して base64 にした物。公開 repo の入力は誰でも見られるので暗号化せずに渡さない
        required: true
permissions:
  contents: read
concurrency:
  group: edit-${{ inputs.job_id }}
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # 道具は非公開の repo から読み取り専用の鍵で取る（公開 repo には置かない）
      - uses: actions/checkout@v4
        with:
          repository: IKEMENLTD/auto-video-edit
          ssh-key: ${{ secrets.AVE_DEPLOY_KEY }}
          path: ave
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ave/tools/pipeline/requirements.txt
      - name: 道具を入れる
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r ave/tools/pipeline/requirements.txt
      - name: 文字起こしの模型（使い回す）
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-turbo-small-v1
      - name: 効果音と BGM（使い回す・repo には入れない）
        uses: actions/cache@v4
        with:
          path: |
            ave/assets/sfx/lab
            ave/assets/bgm
          key: sounds-${{ hashFiles('ave/assets/sounds.json') }}
      - name: 効果音と BGM を揃える
        run: python ave/tools/render/fetch_sounds.py > /dev/null
      - name: 仕事の指示を戻す
        env:
          JOB: ${{ inputs.job }}
          BUNDLE_KEY: ${{ secrets.BUNDLE_KEY }}
        run: printf '%s' "$JOB" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BUNDLE_KEY -out job.json
      - name: 編集する（ログには段の名前だけ）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-sonnet-5-5' }}
          PYTHONIOENCODING: utf-8
        run: python ave/tools/pipeline/job.py job.json work
      - name: 後片付け
        if: always()
        run: rm -rf work job.json
