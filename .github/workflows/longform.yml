name: longform
run-name: longform ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 仕事の番号（でたらめな英数字）。指示は受付がドライブの _指示 に置き、作業箱が番号で取りに行く
        required: true
permissions:
  contents: read
concurrency:
  group: longform-${{ inputs.job_id }}
# 長尺の自動編集（2026-11-10）。正本は IKEMENLTD/auto-video-edit の deploy/runner/longform.yml（ここへ写す）。
# 採用ショート（edit.yml）と同じ守り：段を分け、会員の動画を解く段（make）は鍵の無い別のユーザー worker で回す。
# 長尺は AI を呼ばない（考える所＝編集表は、MCP で呼んだ ChatGPT・Claude のサブスクの AI が受付の道具で書く）＝AI の鍵も渡さない。
# 書き起こし（whisper.cpp）・模型・ffmpeg・Python の部品は、手元（2026-11-10）と同じ版に固定する＝手元と同じ結果。
# 笑い声の模型（2026-11-12）も同じ：重みは指紋つきで使い回し、torch は CPU の版に固定・計算の並びは4本。
jobs:
  longform:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      JOB_ID: ${{ inputs.job_id }}
      WORK: /srv/job/work
      PYTHONIOENCODING: utf-8
      WHISPER_COMMIT: d1be6fde11ac6e0407606b4e42fe72d34add8037
      WHISPER_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-large-v3-turbo-q8_0.bin
      WHISPER_MODEL_SHA256: 317eb69c11673c9de1e1f0d459b253999804ec71ac4c23c17ecf5fbe24e259a1
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-08-12-35/ffmpeg-n8.1.3-34-ga35157abb9-linux64-gpl-8.1.tar.xz
      FFMPEG_SHA256: 4af8ddf89ba988554a8373dfdae378eaafb774d5289b38e584ff2bd3d3a2b0ec
      # 笑い声の模型（PANNs Cnn14_DecisionLevelMax・327MB・MIT）。指紋は laughs.py の MODEL_SHA256 と同じ
      LAUGH_MODEL_URL: https://zenodo.org/records/3987831/files/Cnn14_DecisionLevelMax_mAP%3D0.385.pth?download=1
      LAUGH_MODEL_SHA256: dd3b4043a87d4ec13df8082c0fcfee3fb5084151808e47e060987a95eabdd142
    steps:
      - name: 番号を確かめる・作業のユーザーを作る・場所を空ける
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f]{8,32}$ ]] || { echo "仕事の番号の形が違う"; exit 1; }
          # 4K の素材は合わせて 20〜40GB になる＝使わない道具を消して場所を空ける
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
          sudo useradd -m -s /usr/sbin/nologin worker
          echo "W=$(id -u worker)" >> "$GITHUB_ENV"
          sudo install -d -o "$USER" -m 755 /srv/job "$WORK" /srv/cache
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4（2026-10-29 時点の版に固定）
        with:
          repository: IKEMENLTD/auto-video-edit
          ssh-key: ${{ secrets.AVE_DEPLOY_KEY }}
          persist-credentials: false
          path: ave
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5（2026-10-29 時点の版に固定）
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ave/tools/longform_pipeline/requirements.txt
      - name: 道具を入れる
        id: tools
        run: |
          pip install -q -r ave/tools/longform_pipeline/requirements.txt
          sudo cp -r ave /opt/ave && sudo chown -R root:root /opt/ave && sudo chmod -R a+rX,go-w /opt/ave && rm -rf ave
          echo "python=$(command -v python)" >> "$GITHUB_OUTPUT"
      - name: ffmpeg（使い回す）
        id: ffmpeg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4（2026-10-29 時点の版に固定）
        with:
          path: /srv/cache/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}
      - name: ffmpeg を揃える（版を固定・中身の指紋を確かめる）
        run: |
          if [ ! -x /srv/cache/ffmpeg/bin/ffmpeg ]; then
            curl -sSfL -o /tmp/ff.tar.xz "$FFMPEG_URL"
            echo "$FFMPEG_SHA256  /tmp/ff.tar.xz" | sha256sum -c - > /dev/null
            mkdir -p /srv/cache/ffmpeg && tar -xJf /tmp/ff.tar.xz -C /srv/cache/ffmpeg --strip-components=1 && rm /tmp/ff.tar.xz
          fi
          sudo ln -sf /srv/cache/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /srv/cache/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version | head -1
      - name: ffmpeg を保存する
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4（2026-10-29 時点の版に固定）
        with:
          path: /srv/cache/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}
      - name: whisper.cpp と模型（使い回す）
        id: whisper
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4（2026-10-29 時点の版に固定）
        with:
          path: /srv/cache/whisper
          key: whispercpp-${{ env.WHISPER_COMMIT }}-${{ env.WHISPER_MODEL_SHA256 }}-avx2
      - name: whisper.cpp を組む・模型を揃える（手元と同じ版・模型は中身の指紋を確かめる）
        run: |
          if [ ! -x /srv/cache/whisper/bin/whisper-cli ]; then
            git clone -q https://github.com/ggml-org/whisper.cpp /tmp/wcpp
            git -C /tmp/wcpp checkout -q "$WHISPER_COMMIT"
            # 組む CPU の命令に寄せない（使い回す箱の CPU が違っても動く）。AVX2・FMA・F16C は Actions の箱が全部持つ
            cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF \
              -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON > /dev/null
            cmake --build /tmp/wcpp/build --config Release -j "$(nproc)" --target whisper-cli > /dev/null
            mkdir -p /srv/cache/whisper/bin && cp /tmp/wcpp/build/bin/whisper-cli /srv/cache/whisper/bin/
            rm -rf /tmp/wcpp
          fi
          if [ ! -f /srv/cache/whisper/ggml-large-v3-turbo-q8_0.bin ]; then
            curl -sSfL -o /srv/cache/whisper/ggml-large-v3-turbo-q8_0.bin "$WHISPER_MODEL_URL"
          fi
          echo "$WHISPER_MODEL_SHA256  /srv/cache/whisper/ggml-large-v3-turbo-q8_0.bin" | sha256sum -c - > /dev/null
          /srv/cache/whisper/bin/whisper-cli --help > /dev/null 2>&1 || true
      - name: whisper.cpp と模型を保存する
        if: steps.whisper.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4（2026-10-29 時点の版に固定）
        with:
          path: /srv/cache/whisper
          key: whispercpp-${{ env.WHISPER_COMMIT }}-${{ env.WHISPER_MODEL_SHA256 }}-avx2
      - name: 笑い声の模型（使い回す）
        id: laugh
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4（2026-10-29 時点の版に固定）
        with:
          path: /srv/cache/laugh
          key: laugh-${{ env.LAUGH_MODEL_SHA256 }}
      - name: 笑い声の模型を揃える（中身の指紋を確かめる）
        run: |
          mkdir -p /srv/cache/laugh
          if [ ! -f /srv/cache/laugh/cnn14_dlm.pth ]; then
            curl -sSfL --retry 3 -o /srv/cache/laugh/cnn14_dlm.pth "$LAUGH_MODEL_URL"
          fi
          echo "$LAUGH_MODEL_SHA256  /srv/cache/laugh/cnn14_dlm.pth" | sha256sum -c - > /dev/null
      - name: 笑い声の模型を保存する
        if: steps.laugh.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4（2026-10-29 時点の版に固定）
        with:
          path: /srv/cache/laugh
          key: laugh-${{ env.LAUGH_MODEL_SHA256 }}
      - name: 使い回す物を worker には読むだけにする
        run: |
          sudo chown -R root:root /srv/cache/whisper /srv/cache/ffmpeg /srv/cache/laugh
          sudo chmod -R a+rX,go-w /srv/cache/whisper /srv/cache/ffmpeg /srv/cache/laugh
      # 指示はドライブから番号で受け取る。読んだら消す。素材と音を落とすだけ（ここでは動画を解かない）
      - name: 指示と素材を受け取る
        id: fetch
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPEC_KEY: ${{ secrets.SPEC_KEY }}
          LF_ASSETS_FOLDER: ${{ secrets.LF_ASSETS_FOLDER }}
          ROOTS: ${{ vars.DRIVE_SOURCE_ROOTS }}
        run: |
          if [ -n "$ROOTS" ]; then export DRIVE_SOURCE_ROOTS="$ROOTS"; fi
          python /opt/ave/tools/longform_pipeline/lf_job.py fetch "$JOB_ID" "$RUNNER_TEMP/priv" "$WORK"
          sudo chown -R worker:worker "$WORK"
          df -h / | tail -1
      # 会員の動画を解く段：worker で、鍵は1つも持たない（AI も呼ばない）
      - name: 下ごしらえ・焼く（ログには段の名前だけ）
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          PY: ${{ steps.tools.outputs.python }}
        run: |
          python /opt/ave/tools/longform_pipeline/lf_job.py relay "$RUNNER_TEMP/priv" "$WORK" &
          RELAY=$!
          sudo -u worker --preserve-env=PYTHONIOENCODING \
            env HOME=/home/worker PYTHONDONTWRITEBYTECODE=1 PATH=/usr/local/bin:/usr/bin:/bin \
            WHISPER_CLI=/srv/cache/whisper/bin/whisper-cli WHISPER_MODEL=/srv/cache/whisper/ggml-large-v3-turbo-q8_0.bin \
            LAUGH_MODEL=/srv/cache/laugh/cnn14_dlm.pth LAUGH_THREADS=4 \
            "$PY" /opt/ave/tools/longform_pipeline/lf_job.py make "$WORK" || true
          kill "$RELAY" || true
          sudo crontab -r -u worker 2>/dev/null || true
          sudo pkill -9 -U "$W" || true
          sudo userdel worker || true
          sudo pkill -9 -U "$W" || true
          ! pgrep -U "$W" > /dev/null || { echo "worker の処理が残っている"; exit 1; }
      - name: 仕上がりを置いて共有する
        if: always() && steps.fetch.outcome == 'success'
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
        run: |
          [[ "$W" =~ ^[0-9]+$ ]] || { python /opt/ave/tools/longform_pipeline/lf_job.py fail "$RUNNER_TEMP/priv"; exit 1; }
          sudo pkill -9 -U "$W" || true
          sudo userdel worker 2>/dev/null || true
          if pgrep -U "$W" > /dev/null; then python /opt/ave/tools/longform_pipeline/lf_job.py fail "$RUNNER_TEMP/priv"; exit 1; fi
          sudo find "$WORK" ! -type f ! -type d -delete
          sudo chown -R "$USER" "$WORK"
          python /opt/ave/tools/longform_pipeline/lf_job.py publish "$RUNNER_TEMP/priv" "$WORK"
      # どの段で落ちても、記録を「受付」「実行中」のまま残さない（edit.yml と同じ短い Python・標準の部品だけ）
      - name: 途中で止まった時は記録を失敗にする
        if: failure() || cancelled()
        env:
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
        run: |
          if [[ "${W:-}" =~ ^[0-9]+$ ]]; then sudo pkill -9 -U "$W" || true; fi
          /usr/bin/python3 - <<'PY'
          import datetime, json, os, re, urllib.parse, urllib.request
          API = "https://www.googleapis.com/drive/v3/files"
          def main():
              jid = os.environ.get("JOB_ID", "")
              if not re.fullmatch(r"[0-9a-f]{8,32}", jid):
                  return "仕事の番号の形が違う"
              t = json.loads(os.environ["DRIVE_OAUTH_JSON"])
              t = t.get("tokens", {}).get("default", t)
              form = urllib.parse.urlencode({"grant_type": "refresh_token", "refresh_token": t["refresh_token"],
                                             "client_id": t["client_id"], "client_secret": t["client_secret"]}).encode()
              with urllib.request.urlopen("https://oauth2.googleapis.com/token", form, timeout=60) as r:
                  tok = json.loads(r.read())["access_token"]
              def call(url, data=None, method="GET", kind=None):
                  h = {"Authorization": "Bearer " + tok, **({"Content-Type": kind} if kind else {})}
                  with urllib.request.urlopen(urllib.request.Request(url, data=data, method=method, headers=h), timeout=60) as r:
                      return r.read()
              def find(name, folder):
                  q = urllib.parse.urlencode({"q": f"name = '{name}' and trashed = false and 'me' in owners",
                                              "fields": "files(id,parents)", "pageSize": 20})
                  def mine(p):
                      d = json.loads(call(f"{API}/{p}?fields=name,ownedByMe"))
                      return d.get("name") == folder and d.get("ownedByMe") is True
                  return [f["id"] for f in json.loads(call(API + "?" + q))["files"] if any(mine(p) for p in f.get("parents", []))]
              rec = find(f"job_{jid}.json", "_自動編集の記録")
              if len(rec) != 1:
                  return "記録が見つからない"
              job = json.loads(call(f"{API}/{rec[0]}?alt=media"))
              now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y-%m-%d %H:%M")
              if job.get("id") != jid:
                  return "記録はそのまま"
              if job.get("state") == "取り消し" and not job.get("stopped"):
                  job.update(stage="取り消し", stopped=now)
              elif job.get("state") not in ("受付", "実行中"):
                  return "記録はそのまま"
              elif find(f"{jid}.json", "_取り消し"):
                  job.update(state="取り消し", stage="取り消し", stopped=now)
              else:
                  job.update(state="失敗", error=("長尺の編集の準備で止まりました。" if job["state"] == "受付" else "長尺の編集の途中で止まりました。")
                             + "時間をおいてもう一度頼んでください。")
              job["updated"] = now
              call(f"https://www.googleapis.com/upload/drive/v3/files/{rec[0]}?uploadType=media",
                   json.dumps(job, ensure_ascii=False, indent=1).encode(), "PATCH", "application/json")
              return "記録を書いた（" + job["state"] + "）"
          try:
              print(main())
          except Exception as e:
              print(f"記録を書けない（{type(e).__name__}）")
          PY
